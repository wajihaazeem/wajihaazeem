<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Terminal">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF1F7"/>
      <stop offset="1" stop-color="#E3EDF5"/>
    </linearGradient>
    <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="url(#tbg)" stroke="#D6E2EC" stroke-width="1.5"/>
  <path d="M1 15a14 14 0 0 1 14-14h970a14 14 0 0 1 14 14v32H1z" fill="url(#tbar)"/>
  <line x1="1" y1="47" x2="999" y2="47" stroke="#D6E2EC" stroke-width="1"/>

  <circle cx="30" cy="24" r="6" fill="#B0D4E3"/>
  <circle cx="52" cy="24" r="6" fill="#4682B4"/>
  <circle cx="74" cy="24" r="6" fill="#0B2545"/>

  <text x="500" y="29" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#5C7A99">wajiha@github: ~</text>

  <g font-family="'Fira Code',Consolas,monospace" font-size="18">
    <g opacity="0">
      <text x="40" y="88" fill="#4682B4">$ <tspan fill="#0B2545">whoami</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="118" fill="#4682B4">&gt; wajiha_azeem</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="155" fill="#4682B4">$ <tspan fill="#0B2545">role</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="185" fill="#4682B4">&gt; frontend developer</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="222" fill="#4682B4">$ <tspan fill="#0B2545">skills</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="252" fill="#5C7A99">&gt; react · typescript · node · ui/ux</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
    </g>
  </g>

  <rect x="40" y="268" width="10" height="18" fill="#4682B4">
    <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="none" stroke="#B0D4E3" stroke-opacity="0.7" filter="url(#tglow)">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
