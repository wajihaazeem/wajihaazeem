<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Terminal">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e16"/>
      <stop offset="1" stop-color="#101425"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171d2e"/>
      <stop offset="1" stop-color="#131828"/>
    </linearGradient>
    <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="url(#tbg)" stroke="#2a2f45" stroke-width="1.5"/>
  <path d="M1 15a14 14 0 0 1 14-14h970a14 14 0 0 1 14 14v32H1z" fill="url(#tbar)"/>
  <line x1="1" y1="47" x2="999" y2="47" stroke="#2a2f45" stroke-width="1"/>

  <circle cx="30" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="24" r="6" fill="#27c93f"/>

  <text x="500" y="29" text-anchor="middle" font-family="'Fira Code',Consolas,monospace" font-size="13" fill="#7c8499">wajiha@github: ~</text>

  <g font-family="'Fira Code',Consolas,monospace" font-size="18">
    <g opacity="0">
      <text x="40" y="88" fill="#27c93f">$ <tspan fill="#e6e6f0">whoami</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.3s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="118" fill="#22D3EE">&gt; wajiha_azeem</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="155" fill="#27c93f">$ <tspan fill="#e6e6f0">role</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.7s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="185" fill="#22D3EE">&gt; frontend developer</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.4s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="222" fill="#27c93f">$ <tspan fill="#e6e6f0">skills</tspan></text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
    </g>
    <g opacity="0">
      <text x="40" y="252" fill="#A855F7">&gt; react · typescript · node · ui/ux</text>
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.8s" fill="freeze"/>
    </g>
  </g>

  <rect x="40" y="268" width="10" height="18" fill="#22D3EE">
    <animate attributeName="opacity" values="0;1;1;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="998" height="298" rx="14" fill="none" stroke="#6C63FF" stroke-opacity="0.35" filter="url(#tglow)">
    <animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
