<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" role="img" aria-label="Wajiha Azeem — Frontend Developer">
  <defs>
    <radialGradient id="glowLeft" cx="0.12" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#B0D4E3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#B0D4E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.9" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#4682B4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4682B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0D4E3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4682B4"/>
      <stop offset="1" stop-color="#B0D4E3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D9BC7"/>
      <stop offset="1" stop-color="#4682B4"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1000" height="280" fill="#F7F9FC"/>
  <rect width="1000" height="280" fill="url(#glowLeft)"/>
  <rect width="1000" height="280" fill="url(#glowRight)"/>

  <!-- eyebrow -->
  <text x="70" y="58" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#5C7A99">GITHUB PROFILE</text>
  <rect x="70" y="70" width="34" height="2.5" rx="1.25" fill="#4682B4"/>

  <!-- name -->
  <text x="70" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5" fill="#0B2545">Wajiha Azeem</text>

  <!-- role -->
  <text x="70" y="154" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#5C7A99">Frontend Developer  ·  UI Engineer</text>

  <!-- accent underline -->
  <rect x="70" y="167" width="90" height="2" rx="1" fill="url(#accentLine)">
    <animate attributeName="width" values="70;130;70" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- status pill -->
  <g>
    <rect x="70" y="183" width="178" height="28" rx="14" fill="#FFFFFF" stroke="#D6E2EC" stroke-width="1"/>
    <circle cx="88" cy="197" r="3.5" fill="#4682B4">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88" cy="197" r="3.5" fill="#4682B4" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="102" y="201" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#334E68">Open to opportunities</text>
  </g>

  <!-- right orbital graphic -->
  <g>
    <circle cx="835" cy="140" r="40" fill="none" stroke="#D6E2EC" stroke-width="1"/>
    <circle cx="835" cy="140" r="68" fill="none" stroke="#C2D6E6" stroke-width="1"/>
    <circle cx="835" cy="140" r="96" fill="none" stroke="#C2D6E6" stroke-width="1"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 835 140" to="360 835 140" dur="20s" repeatCount="indefinite"/>
      <circle cx="835" cy="72" r="4" fill="#4682B4"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 835 140" to="0 835 140" dur="30s" repeatCount="indefinite"/>
      <circle cx="835" cy="44" r="2.6" fill="#B0D4E3"/>
    </g>

    <circle cx="835" cy="140" r="8" fill="url(#node)"/>
    <circle cx="835" cy="140" r="8" fill="#4682B4" opacity="0.4" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer hairline with moving highlight -->
  <line x1="70" y1="254" x2="930" y2="254" stroke="#D6E2EC" stroke-width="1"/>
  <rect y="253" width="90" height="2" rx="1" fill="url(#accentLine)">
    <animate attributeName="x" values="70;840;70" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
