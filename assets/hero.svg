<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" role="img" aria-label="Wajiha Azeem — Data Science and Software Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="0.6" stop-color="#0E2C50"/>
      <stop offset="1" stop-color="#123A61"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0D4E3"/>
      <stop offset="0.5" stop-color="#4682B4"/>
      <stop offset="1" stop-color="#B0D4E3"/>
      <animate attributeName="x1" values="-0.4;0.2;-0.4" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.6;1.2;0.6" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEBF4"/>
      <stop offset="1" stop-color="#A9CCE3"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173A5E"/>
      <stop offset="1" stop-color="#112F4F"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B0D4E3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6FA8C9"/>
      <stop offset="1" stop-color="#B0D4E3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#B0D4E3" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#B0D4E3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.9" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#4682B4" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4682B4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>
  <rect width="1000" height="260" fill="url(#glowLeft)"/>
  <rect width="1000" height="260" fill="url(#glowRight)"/>
  <rect width="1000" height="3" fill="url(#topGrad)"/>

  <!-- monogram -->
  <rect x="64" y="46" width="48" height="48" rx="13" fill="url(#brand)"/>
  <text x="88" y="76" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="0.5" fill="#0B2545">WA</text>

  <!-- name + role -->
  <text x="126" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="0.3" fill="#F2F7FB">Wajiha Azeem</text>
  <text x="127" y="89" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#A9C0D6">Data Science  ·  Software Development</text>

  <!-- divider -->
  <line x1="64" y1="116" x2="600" y2="116" stroke="#274A6E" stroke-width="1"/>

  <!-- tagline -->
  <text x="64" y="144" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#D3E1EE">Building clean software and data-driven solutions.</text>

  <!-- status pill -->
  <g>
    <rect x="64" y="162" width="186" height="30" rx="15" fill="#0F2E4F" stroke="#274A6E" stroke-width="1"/>
    <circle cx="83" cy="177" r="3.5" fill="#8FC3DD">
      <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.45;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="83" cy="177" r="3.5" fill="#8FC3DD" opacity="0.3" filter="url(#glow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="97" y="181" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D3E1EE">Open to opportunities</text>
  </g>

  <!-- location pill -->
  <g>
    <rect x="258" y="162" width="140" height="30" rx="15" fill="#0F2E4F" stroke="#274A6E" stroke-width="1"/>
    <g transform="translate(276,177)">
      <path d="M0,9 C0,9 -7,3 -7,-2 A7,7 0 1,1 7,-2 C7,3 0,9 0,9 Z" fill="#7FB2D4"/>
      <circle cx="0" cy="-2" r="2.4" fill="#0F2E4F"/>
    </g>
    <text x="290" y="181" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#D3E1EE">Lahore, Pakistan</text>
  </g>

  <!-- right watermark -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
    <circle cx="866" cy="128" r="98" fill="none" stroke="#1E4064" stroke-width="1"/>
    <text x="866" y="196" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="180" font-weight="800" letter-spacing="-6" fill="url(#wm)">WA</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 866 128" to="360 866 128" dur="24s" repeatCount="indefinite"/>
      <circle cx="866" cy="30" r="3.5" fill="#8FC3DD"/>
    </g>
  </g>

  <!-- bottom hairline with moving highlight -->
  <line x1="64" y1="228" x2="936" y2="228" stroke="#1E4064" stroke-width="1"/>
  <rect y="227" width="90" height="2" rx="1" fill="url(#accentLine)">
    <animate attributeName="x" values="64;846;64" dur="10s" repeatCount="indefinite"/>
  </rect>
</svg>
